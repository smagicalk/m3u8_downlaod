<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M3U8 下载器</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; background: #f4f7f9; color: #16222a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    main { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 52px 0 72px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; border-bottom: 1px solid #cdd8dd; padding-bottom: 20px; }
    h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: 0; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .health { color: #52636b; font-size: 14px; white-space: nowrap; }
    .health.ready { color: #087f5b; }
    .health.missing { color: #b54708; }
    form { margin: 28px 0 36px; }
    .primary-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; }
    .request-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; border-top: 1px solid #dbe3e7; margin-top: 18px; padding-top: 18px; }
    .field { display: grid; gap: 6px; min-width: 0; }
    .field-wide { grid-column: 1 / -1; }
    .check-field { align-content: end; }
    .check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: #34434a; font-size: 14px; }
    .check input { width: 16px; min-height: 16px; accent-color: #087f5b; }
    label { color: #52636b; font-size: 13px; font-weight: 650; }
    input, select, button { min-height: 44px; border-radius: 6px; font: inherit; letter-spacing: 0; }
    input, select { width: 100%; border: 1px solid #9eafb8; background: #fff; padding: 0 12px; color: #16222a; outline: none; }
    input:focus, select:focus { border-color: #087f5b; box-shadow: 0 0 0 3px #bfe8da; }
    .directory-picker { display: flex; gap: 8px; min-width: 0; }
    .directory-picker input { min-width: 0; }
    .directory-select { flex: 0 0 44px; width: 44px; padding: 0; font-size: 18px; }
    button { border: 0; background: #087f5b; color: #fff; padding: 0 18px; cursor: pointer; font-weight: 650; }
    button:hover { background: #056b4c; }
    button:disabled { background: #9eafb8; cursor: not-allowed; }
    .notice { min-height: 22px; margin: -24px 0 24px; color: #b42318; font-size: 14px; }
    .settings-section { margin-bottom: 36px; }
    .settings-section form { margin: 0; }
    .settings-subsection { margin-top: 26px; padding-top: 20px; border-top: 1px solid #dbe3e7; }
    .settings-subsection h3 { margin: 0 0 12px; font-size: 15px; }
    .settings-actions { display: flex; align-items: center; justify-content: end; gap: 10px; margin-top: 14px; }
    .header-link, .logout { min-height: 34px; padding: 0 10px; border: 1px solid #9eafb8; border-radius: 6px; background: transparent; color: #34434a; font-size: 13px; font-weight: 650; text-decoration: none; }
    .header-link { display: inline-flex; align-items: center; }
    .header-link:hover, .logout:hover { background: #e5ecef; color: #16222a; }
    .secondary-button { min-height: 44px; background: transparent; border: 1px solid #9eafb8; color: #34434a; }
    .secondary-button:hover { background: #e5ecef; }
    .telegram-state { color: #52636b; font-size: 13px; }
    section { border-top: 2px solid #16222a; }
    h2 { margin: 18px 0 12px; font-size: 16px; }
    .empty { color: #667780; padding: 26px 0; border-top: 1px solid #dbe3e7; }
    .task { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; border-top: 1px solid #dbe3e7; padding: 16px 0; }
    .task[role="button"] { cursor: pointer; }
    .task[role="button"]:hover, .task[role="button"]:focus { background: #edf3f1; outline: none; }
    .task h3 { margin: 0 0 6px; font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
    .meta { color: #667780; font-size: 13px; }
    .progress { height: 5px; overflow: hidden; background: #dbe3e7; margin-top: 9px; }
    .progress > span { display: block; height: 100%; background: #087f5b; transition: width .2s ease; }
    .detail-toolbar { display: flex; align-items: center; gap: 12px; margin: 18px 0 12px; }
    .detail-toolbar h2 { margin: 0; overflow-wrap: anywhere; }
    .detail-back { min-height: 34px; width: 34px; padding: 0; background: transparent; border: 1px solid #9eafb8; color: #34434a; font-size: 18px; }
    .detail-back:hover { background: #e5ecef; }
    .detail-summary { display: grid; gap: 10px; padding: 14px 0; border-top: 1px solid #dbe3e7; border-bottom: 1px solid #dbe3e7; }
    .detail-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; color: #52636b; font-size: 13px; }
    .detail-meta span { overflow-wrap: anywhere; }
    .log-output { height: 360px; overflow: auto; margin-top: 14px; border: 1px solid #9eafb8; background: #f8fbfa; padding: 10px; color: #34434a; font: 12px/1.5 Consolas, "Cascadia Mono", monospace; }
    .log-output:empty::before { content: "暂无日志"; color: #7b8b92; }
    .task-log-line { overflow-wrap: anywhere; }
    .task-log-time { color: #7b8b92; margin-right: 7px; }
    .task-log-line.error { color: #b42318; }
    .task-log-line.warning { color: #a15c00; }
    .state { display: flex; align-items: center; gap: 12px; }
    .badge { display: inline-flex; min-width: 66px; justify-content: center; padding: 5px 8px; border-radius: 4px; background: #e5ecef; color: #34434a; font-size: 12px; font-weight: 650; }
    .badge.running { background: #d7efe8; color: #056b4c; }
    .badge.completed { background: #d7efe8; color: #056b4c; }
    .badge.failed { background: #fde4e1; color: #b42318; }
    .badge.cancelled { background: #ece6dc; color: #6f5b3e; }
    .action { min-height: 34px; background: transparent; border: 1px solid #9eafb8; color: #34434a; padding: 0 10px; }
    .action:hover { background: #e5ecef; }
    .cancel { color: #b42318; border-color: #d6a5a0; }
    .cancel:hover { background: #fde4e1; }
    a { color: #056b4c; }
    @media (max-width: 720px) { main { width: min(100% - 24px, 980px); padding-top: 28px; } header { align-items: start; flex-direction: column; gap: 8px; } .primary-row, .request-grid, .detail-meta { grid-template-columns: 1fr; } .field-wide { grid-column: auto; } .task { grid-template-columns: 1fr; gap: 10px; } .state { justify-content: space-between; } .header-actions { flex-wrap: wrap; } .log-output { height: 300px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>M3U8 下载器</h1>
      <div class="header-actions"><span id="health" class="health">正在检查 FFmpeg</span><a class="header-link" href="/password">修改密码</a><button id="logout" class="logout" type="button">退出</button></div>
    </header>
    <form id="task-form">
      <div class="primary-row">
        <div class="field">
          <label for="source-url">M3U8 地址</label>
          <input id="source-url" name="sourceUrl" type="url" placeholder="https://example.com/video.m3u8" required>
        </div>
        <button id="submit" type="submit">开始下载</button>
      </div>
      <div class="request-grid">
        <div class="field field-wide">
          <label for="user-agent">User-Agent</label>
          <input id="user-agent" name="userAgent" type="text" value="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36">
        </div>
        <div class="field">
          <label for="referer">Referer</label>
          <input id="referer" name="referer" type="url" placeholder="https://example.com/page">
        </div>
        <div class="field">
          <label for="cookie">Cookie</label>
          <input id="cookie" name="cookie" type="password" autocomplete="off">
        </div>
        <div class="field">
          <label for="output-name">输出文件名</label>
          <input id="output-name" name="outputName" type="text" placeholder="video.mp4">
        </div>
        <div class="field">
          <label for="output-directory">保存目录</label>
          <div class="directory-picker"><input id="output-directory" name="outputDirectory" type="text" value="downloads"><button class="directory-select" type="button" data-directory-input="output-directory" aria-label="选择保存目录" title="选择保存目录">&#128193;</button></div>
        </div>
        <div class="field">
          <label for="cache-directory">缓存目录</label>
          <div class="directory-picker"><input id="cache-directory" name="cacheDirectory" type="text" value="cache"><button class="directory-select" type="button" data-directory-input="cache-directory" aria-label="选择缓存目录" title="选择缓存目录">&#128193;</button></div>
        </div>
        <div class="field check-field">
          <label>缓存处理</label>
          <label class="check" for="delete-cache"><input id="delete-cache" name="deleteCache" type="checkbox" checked> 合并成功后删除缓存</label>
        </div>
        <div class="field check-field">
          <label for="worker-count">分片并发数</label>
          <select id="worker-count" name="workerCount">
            <option value="1">1</option>
            <option value="4">4</option>
            <option value="8" selected>8</option>
            <option value="16">16</option>
          </select>
        </div>
      </div>
    </form>
    <p id="notice" class="notice" role="alert"></p>
    <section class="settings-section" aria-labelledby="settings-heading">
      <h2 id="settings-heading">设置</h2>
      <div class="settings-subsection" aria-labelledby="download-settings-heading">
      <h3 id="download-settings-heading">下载默认值</h3>
      <form id="settings-form">
        <div class="request-grid">
          <div class="field"><label for="default-output-directory">默认保存目录</label><div class="directory-picker"><input id="default-output-directory" type="text"><button class="directory-select" type="button" data-directory-input="default-output-directory" aria-label="选择默认保存目录" title="选择默认保存目录">&#128193;</button></div></div>
          <div class="field"><label for="default-cache-directory">默认缓存目录</label><div class="directory-picker"><input id="default-cache-directory" type="text"><button class="directory-select" type="button" data-directory-input="default-cache-directory" aria-label="选择默认缓存目录" title="选择默认缓存目录">&#128193;</button></div></div>
          <div class="field check-field"><label>默认缓存处理</label><label class="check" for="default-delete-cache"><input id="default-delete-cache" type="checkbox"> 合并成功后删除缓存</label></div>
          <div class="field check-field"><label for="default-worker-count">默认分片并发数</label><select id="default-worker-count"><option value="1">1</option><option value="4">4</option><option value="8">8</option><option value="16">16</option></select></div>
        </div>
        <div class="settings-actions"><button id="save-settings" type="submit">保存默认设置</button></div>
      </form>
      </div>
      <div class="settings-subsection" aria-labelledby="telegram-heading">
      <h3 id="telegram-heading">Telegram Bot</h3>
      <form id="telegram-form">
        <div class="request-grid">
          <div class="field"><label for="telegram-api-base-url">本地 Bot API Server 地址</label><input id="telegram-api-base-url" type="url" value="http://127.0.0.1:8081" required></div>
          <div class="field"><label for="telegram-token">Bot Token</label><input id="telegram-token" type="password" autocomplete="off" placeholder="已绑定时留空以保留原 Token"></div>
          <div class="field field-wide"><label for="telegram-chat-ids">目标 Chat ID</label><input id="telegram-chat-ids" type="text" placeholder="多个 ID 用英文逗号分隔，例如 123456,-1001234567890" required></div>
          <div class="field check-field"><label>上传策略</label><label class="check" for="telegram-auto-upload"><input id="telegram-auto-upload" type="checkbox"> 下载完成后自动上传</label></div>
          <div class="field"><label for="telegram-split-size">切分大小（MB）</label><input id="telegram-split-size" type="number" min="1" max="2000" value="1900" required></div>
        </div>
        <div class="settings-actions"><span id="telegram-state" class="telegram-state"></span><button id="unbind-telegram" class="secondary-button" type="button">解除绑定</button><button id="test-telegram" class="secondary-button" type="button">测试连接</button><button id="save-telegram" type="submit">保存 Bot 绑定</button></div>
      </form>
      </div>
    </section>
    <section id="tasks-section" aria-labelledby="tasks-heading">
      <h2 id="tasks-heading">任务</h2>
      <div id="tasks" class="empty">暂无任务</div>
    </section>
    <section id="task-detail" hidden aria-labelledby="detail-heading"></section>
  </main>
  <script>
    const form = document.querySelector('#task-form');
    const settingsForm = document.querySelector('#settings-form');
    const telegramForm = document.querySelector('#telegram-form');
    const sourceInput = document.querySelector('#source-url');
    const userAgentInput = document.querySelector('#user-agent');
    const refererInput = document.querySelector('#referer');
    const cookieInput = document.querySelector('#cookie');
    const outputInput = document.querySelector('#output-name');
    const outputDirectoryInput = document.querySelector('#output-directory');
    const cacheDirectoryInput = document.querySelector('#cache-directory');
    const deleteCacheInput = document.querySelector('#delete-cache');
    const workerCountInput = document.querySelector('#worker-count');
    const submit = document.querySelector('#submit');
    const notice = document.querySelector('#notice');
    const tasks = document.querySelector('#tasks');
    const tasksSection = document.querySelector('#tasks-section');
    const taskDetail = document.querySelector('#task-detail');
    const health = document.querySelector('#health');
    const logout = document.querySelector('#logout');
    const defaultOutputDirectoryInput = document.querySelector('#default-output-directory');
    const defaultCacheDirectoryInput = document.querySelector('#default-cache-directory');
    const defaultDeleteCacheInput = document.querySelector('#default-delete-cache');
    const defaultWorkerCountInput = document.querySelector('#default-worker-count');
    const saveSettings = document.querySelector('#save-settings');
    const telegramAPIBaseURLInput = document.querySelector('#telegram-api-base-url');
    const telegramTokenInput = document.querySelector('#telegram-token');
    const telegramChatIDsInput = document.querySelector('#telegram-chat-ids');
    const telegramAutoUploadInput = document.querySelector('#telegram-auto-upload');
    const telegramSplitSizeInput = document.querySelector('#telegram-split-size');
    const telegramState = document.querySelector('#telegram-state');
    const saveTelegram = document.querySelector('#save-telegram');
    const testTelegram = document.querySelector('#test-telegram');
    const unbindTelegram = document.querySelector('#unbind-telegram');
    const labels = { queued: '等待中', running: '下载中', completed: '已完成', failed: '失败', cancelled: '已取消' };
    const phaseLabels = { downloading: '下载分片', merging: '合并中' };
    let selectedTaskID = null;

    function escapeHTML(value) {
      const element = document.createElement('span');
      element.textContent = value;
      return element.innerHTML;
    }

    function formatTime(seconds) {
      const total = Math.floor(seconds);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      return `${hours ? `${hours}:` : ''}${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function formatProgress(item) {
      if (item.phase === 'downloading' && item.totalSegments) {
        return `下载分片 ${item.completedSegments} / ${item.totalSegments} · ${formatBytes(item.downloadedBytes)}`;
      }
      if (!item.progressSec) return item.phase ? phaseLabels[item.phase] : '等待进度';
      const total = item.durationSec ? ` / ${formatTime(item.durationSec)}` : '';
      return `${phaseLabels[item.phase] || '已处理'} ${formatTime(item.progressSec)}${total}`;
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      const index = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
      return `${(bytes / (1024 ** index)).toFixed(index ? 1 : 0)} ${units[index]}`;
    }

    function formatLogTime(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? '--:--:--' : date.toLocaleTimeString('zh-CN', { hour12: false });
    }

    function taskPercent(item) {
      if (item.phase === 'downloading' && item.totalSegments) return Math.min(100, Math.max(0, item.completedSegments / item.totalSegments * 100));
      return item.durationSec ? Math.min(100, Math.max(0, item.progressSec / item.durationSec * 100)) : 0;
    }

    function taskActions(item) {
      const pause = item.status === 'running' ? `<button class="action" type="button" data-action="pause" data-id="${item.id}">暂停</button>` : '';
      const resume = item.status === 'paused' ? `<button class="action" type="button" data-action="resume" data-id="${item.id}">继续</button>` : '';
      const cancel = ['queued', 'running', 'paused'].includes(item.status) ? `<button class="action cancel" type="button" data-action="cancel" data-id="${item.id}">取消</button>` : '';
      const upload = item.status === 'completed' ? `<button class="action" type="button" data-action="telegram-upload" data-id="${item.id}">上传 TG</button>` : '';
      return `${pause}${resume}${cancel}${upload}`;
    }

    function renderDetail(item) {
      const previousOutput = taskDetail.querySelector('.log-output');
      const previousScrollTop = previousOutput?.scrollTop || 0;
      const shouldFollow = !previousOutput || previousOutput.scrollHeight - previousOutput.clientHeight - previousScrollTop < 24;
      const download = item.status === 'completed' ? `<a href="/api/tasks/${item.id}/download" download>获取文件</a>` : '';
      const stateLabel = item.status === 'paused' ? '已暂停' : labels[item.status];
      const error = item.error ? `<div class="meta">${escapeHTML(item.error)}</div>` : '';
      const logs = item.logs?.map((entry) => `<div class="task-log-line ${escapeHTML(entry.level)}"><span class="task-log-time">${formatLogTime(entry.at)}</span>${escapeHTML(entry.message)}</div>`).join('') || '';
      taskDetail.innerHTML = `<div class="detail-toolbar"><button class="detail-back" type="button" data-action="back" aria-label="返回任务列表" title="返回任务列表">&#8592;</button><h2 id="detail-heading">${escapeHTML(item.outputName)}</h2><span class="badge ${item.status}">${stateLabel}</span></div><div class="detail-summary"><div class="meta">${formatProgress(item)} · ${download}</div><div class="progress" aria-label="下载进度"><span style="width: ${taskPercent(item)}%"></span></div>${error}<div class="detail-meta"><span>保存目录：${escapeHTML(item.outputDirectory)}</span><span>缓存目录：${escapeHTML(item.cacheDirectory || '未设置')}</span><span>分片并发：${item.workerCount}</span><span>缓存清理：${item.deleteCache ? '合并后删除' : '保留'}</span></div><div class="state">${taskActions(item)}</div></div><div class="log-output" role="log" aria-live="polite">${logs}</div>`;
      const output = taskDetail.querySelector('.log-output');
      output.scrollTop = shouldFollow ? output.scrollHeight : previousScrollTop;
    }

    async function request(path, options) {
      const response = await fetch(path, options);
      const body = await response.json();
      if (!response.ok) throw new Error(body.error || '请求失败');
      return body;
    }

    function render(items) {
      const selected = items.find((item) => item.id === selectedTaskID);
      if (selected) {
        tasksSection.hidden = true;
        taskDetail.hidden = false;
        renderDetail(selected);
        return;
      }
      selectedTaskID = null;
      tasksSection.hidden = false;
      taskDetail.hidden = true;
      if (!items.length) {
        tasks.className = 'empty';
        tasks.textContent = '暂无任务';
        return;
      }
      tasks.className = '';
      tasks.innerHTML = items.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).map((item) => {
        const download = item.status === 'completed' ? ` · <a href="/api/tasks/${item.id}/download" download>获取文件</a>` : '';
        const error = item.error ? ` · ${escapeHTML(item.error)}` : '';
        const percent = taskPercent(item);
        const stateLabel = item.status === 'paused' ? '已暂停' : labels[item.status];
        return `<article class="task" role="button" tabindex="0" data-task-id="${item.id}"><div><h3>${escapeHTML(item.outputName)}</h3><div class="meta">${formatProgress(item)} · ${escapeHTML(item.outputDirectory)}${download}${error}</div><div class="progress" aria-label="下载进度"><span style="width: ${percent}%"></span></div></div><div class="state"><span class="badge ${item.status}">${stateLabel}</span>${taskActions(item)}</div></article>`;
      }).join('');
    }

    async function refresh() {
      try { render(await request('/api/tasks')); } catch (error) { notice.textContent = error.message; }
    }

    async function checkHealth() {
      try {
        const data = await request('/api/health');
        health.textContent = data.ffmpegAvailable ? 'FFmpeg 已就绪' : '未检测到 FFmpeg';
        health.className = `health ${data.ffmpegAvailable ? 'ready' : 'missing'}`;
      } catch { health.textContent = '服务状态未知'; }
    }

    async function loadSettings() {
      try {
        const settings = await request('/api/settings/defaults');
        outputDirectoryInput.value = settings.outputDirectory;
        cacheDirectoryInput.value = settings.cacheDirectory;
        deleteCacheInput.checked = settings.deleteCache;
        workerCountInput.value = String(settings.workerCount);
        defaultOutputDirectoryInput.value = settings.outputDirectory;
        defaultCacheDirectoryInput.value = settings.cacheDirectory;
        defaultDeleteCacheInput.checked = settings.deleteCache;
        defaultWorkerCountInput.value = String(settings.workerCount);
      } catch (error) { notice.textContent = error.message; }
    }

    async function loadTelegramConfiguration() {
      try {
        const settings = await request('/api/telegram/config');
        telegramAPIBaseURLInput.value = settings.apiBaseUrl;
        telegramChatIDsInput.value = settings.chatIds;
        telegramAutoUploadInput.checked = settings.autoUpload;
        telegramSplitSizeInput.value = String(settings.splitSizeMb);
        telegramTokenInput.placeholder = settings.botTokenConfigured ? '已绑定，留空以保留原 Token' : '请输入 Bot Token';
        telegramState.textContent = settings.connected ? '已绑定，正在监听 Bot 指令' : '尚未完成绑定';
      } catch (error) { notice.textContent = error.message; }
    }

    async function chooseDirectory(input, button) {
      button.disabled = true;
      notice.textContent = '';
      try {
        const result = await request('/api/directories/select', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ initialDirectory: input.value }) });
        if (result.path) input.value = result.path;
      } catch (error) { notice.textContent = error.message; }
      finally { button.disabled = false; }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      notice.textContent = '';
      submit.disabled = true;
      try {
        await request('/api/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sourceUrl: sourceInput.value, referer: refererInput.value, cookie: cookieInput.value, userAgent: userAgentInput.value, outputName: outputInput.value, outputDirectory: outputDirectoryInput.value, cacheDirectory: cacheDirectoryInput.value, deleteCache: deleteCacheInput.checked, workerCount: Number(workerCountInput.value) }) });
        outputInput.value = '';
        await refresh();
      } catch (error) { notice.textContent = error.message; }
      finally { submit.disabled = false; }
    });

    document.addEventListener('click', (event) => {
      const button = event.target.closest('[data-directory-input]');
      if (!button) return;
      const input = document.querySelector(`#${button.dataset.directoryInput}`);
      if (input) chooseDirectory(input, button);
    });

    settingsForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      notice.textContent = '';
      saveSettings.disabled = true;
      try {
        const settings = await request('/api/settings/defaults', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ outputDirectory: defaultOutputDirectoryInput.value, cacheDirectory: defaultCacheDirectoryInput.value, deleteCache: defaultDeleteCacheInput.checked, workerCount: Number(defaultWorkerCountInput.value) }) });
        outputDirectoryInput.value = settings.outputDirectory;
        cacheDirectoryInput.value = settings.cacheDirectory;
        deleteCacheInput.checked = settings.deleteCache;
        workerCountInput.value = String(settings.workerCount);
        notice.textContent = '默认设置已保存';
      } catch (error) { notice.textContent = error.message; }
      finally { saveSettings.disabled = false; }
    });

    telegramForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      notice.textContent = '';
      saveTelegram.disabled = true;
      try {
        const settings = await request('/api/telegram/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ apiBaseUrl: telegramAPIBaseURLInput.value, botToken: telegramTokenInput.value, chatIds: telegramChatIDsInput.value, autoUpload: telegramAutoUploadInput.checked, splitSizeMb: Number(telegramSplitSizeInput.value) }) });
        telegramTokenInput.value = '';
        telegramTokenInput.placeholder = settings.botTokenConfigured ? '已绑定，留空以保留原 Token' : '请输入 Bot Token';
        telegramState.textContent = settings.connected ? '已绑定，正在监听 Bot 指令' : '尚未完成绑定';
        notice.textContent = 'Telegram Bot 设置已保存';
      } catch (error) { notice.textContent = error.message; }
      finally { saveTelegram.disabled = false; }
    });

    testTelegram.addEventListener('click', async () => {
      notice.textContent = '';
      testTelegram.disabled = true;
      try { await request('/api/telegram/test', { method: 'POST' }); telegramState.textContent = 'Bot API Server 连接正常'; }
      catch (error) { notice.textContent = error.message; }
      finally { testTelegram.disabled = false; }
    });

    unbindTelegram.addEventListener('click', async () => {
      notice.textContent = '';
      unbindTelegram.disabled = true;
      try {
        const settings = await request('/api/telegram/config', { method: 'DELETE' });
        telegramTokenInput.value = '';
        telegramChatIDsInput.value = '';
        telegramAutoUploadInput.checked = false;
        telegramState.textContent = settings.connected ? '已绑定，正在监听 Bot 指令' : '已解除绑定';
      } catch (error) { notice.textContent = error.message; }
      finally { unbindTelegram.disabled = false; }
    });

    logout.addEventListener('click', async () => {
      try { await request('/api/auth/logout', { method: 'POST' }); } finally { window.location.assign('/login'); }
    });

    tasks.addEventListener('click', async (event) => {
      const { action, id } = event.target.dataset;
      if (action && id) {
        try { await request(`/api/tasks/${id}/${action}`, { method: 'POST' }); await refresh(); }
        catch (error) { notice.textContent = error.message; }
        return;
      }
      if (event.target.closest('a, button')) return;
      const item = event.target.closest('[data-task-id]');
      if (item) { selectedTaskID = item.dataset.taskId; render(await request('/api/tasks')); }
    });

    tasks.addEventListener('keydown', async (event) => {
      if (!['Enter', ' '].includes(event.key)) return;
      const item = event.target.closest('[data-task-id]');
      if (!item) return;
      event.preventDefault();
      selectedTaskID = item.dataset.taskId;
      render(await request('/api/tasks'));
    });

    taskDetail.addEventListener('click', async (event) => {
      const { action, id } = event.target.dataset;
      if (action === 'back') { selectedTaskID = null; await refresh(); return; }
      if (!action || !id) return;
      try { await request(`/api/tasks/${id}/${action}`, { method: 'POST' }); await refresh(); }
      catch (error) { notice.textContent = error.message; }
    });

    checkHealth();
    loadSettings();
    loadTelegramConfiguration();
    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
