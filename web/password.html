<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>修改密码 - M3U8 下载器</title>
  <style>
    :root { font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; background: #f4f7f9; color: #16222a; } * { box-sizing: border-box; } body { margin: 0; min-width: 320px; } main { width: min(100% - 32px, 520px); margin: 0 auto; padding: 10vh 0; } header { display: flex; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 1px solid #cdd8dd; padding-bottom: 18px; } h1 { margin: 0; font-size: 24px; } a { color: #056b4c; font-weight: 650; } form { display: grid; gap: 16px; margin-top: 28px; } label { color: #52636b; font-size: 13px; font-weight: 650; } .field { display: grid; gap: 6px; } input, button { min-height: 44px; border-radius: 6px; font: inherit; } input { width: 100%; border: 1px solid #9eafb8; padding: 0 12px; } input:focus { border-color: #087f5b; outline: 3px solid #bfe8da; } button { border: 0; background: #087f5b; color: #fff; font-weight: 650; cursor: pointer; } button:hover { background: #056b4c; } button:disabled { background: #9eafb8; } #notice { min-height: 20px; margin: 0; color: #b42318; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <header><h1>修改密码</h1><a href="/">返回下载器</a></header>
    <form id="password-form">
      <div class="field"><label for="current-password">当前密码</label><input id="current-password" type="password" autocomplete="current-password" required autofocus></div>
      <div class="field"><label for="new-password">新密码</label><input id="new-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div>
      <div class="field"><label for="confirm-password">确认新密码</label><input id="confirm-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div>
      <p id="notice" role="alert"></p>
      <button id="submit" type="submit">保存并重新登录</button>
    </form>
  </main>
  <script>
    const form = document.querySelector('#password-form'); const current = document.querySelector('#current-password'); const next = document.querySelector('#new-password'); const confirm = document.querySelector('#confirm-password'); const notice = document.querySelector('#notice'); const submit = document.querySelector('#submit');
    form.addEventListener('submit', async (event) => { event.preventDefault(); notice.textContent = ''; if (next.value !== confirm.value) { notice.textContent = '两次输入的新密码不一致'; return; } submit.disabled = true; try { const response = await fetch('/api/auth/password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ currentPassword: current.value, newPassword: next.value }) }); const body = await response.json(); if (!response.ok) throw new Error(body.error || '修改密码失败'); window.location.assign('/login'); } catch (error) { notice.textContent = error.message; } finally { submit.disabled = false; } });
  </script>
</body>
</html>
