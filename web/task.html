<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>任务详情 - M3U8 下载器</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; background: #f4f7f9; color: #16222a; } * { box-sizing: border-box; } body { margin: 0; min-width: 320px; } main { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 64px; } header { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #cdd8dd; padding-bottom: 18px; } h1 { margin: 0; font-size: 24px; } .header-link, button { min-height: 36px; border-radius: 6px; font: inherit; letter-spacing: 0; } .header-link { display: inline-flex; align-items: center; padding: 0 10px; border: 1px solid #9eafb8; color: #34434a; font-size: 13px; font-weight: 650; text-decoration: none; } .header-link:hover, .action:hover { background: #e5ecef; } #notice { min-height: 22px; margin: 18px 0 0; color: #b42318; font-size: 14px; } section { margin-top: 22px; border-top: 2px solid #16222a; } .toolbar { display: flex; align-items: center; gap: 12px; padding: 16px 0; } .toolbar h2 { flex: 1; min-width: 0; margin: 0; font-size: 17px; overflow-wrap: anywhere; } .badge { display: inline-flex; min-width: 66px; justify-content: center; padding: 5px 8px; border-radius: 4px; background: #e5ecef; color: #34434a; font-size: 12px; font-weight: 650; } .badge.running, .badge.completed { background: #d7efe8; color: #056b4c; } .badge.failed, .badge.cancelled { background: #fde4e1; color: #b42318; } .summary { display: grid; gap: 12px; border-top: 1px solid #dbe3e7; border-bottom: 1px solid #dbe3e7; padding: 15px 0; } .meta { color: #52636b; font-size: 13px; overflow-wrap: anywhere; } .detail-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; } .progress { height: 5px; overflow: hidden; background: #dbe3e7; } .progress > span { display: block; height: 100%; background: #087f5b; transition: width .2s ease; } .actions { display: flex; flex-wrap: wrap; gap: 8px; } button { border: 1px solid #9eafb8; background: transparent; color: #34434a; padding: 0 12px; cursor: pointer; font-size: 13px; font-weight: 650; } button:disabled { color: #9eafb8; cursor: not-allowed; } .cancel, .danger { color: #b42318; border-color: #d6a5a0; } .cancel:hover, .danger:hover { background: #fde4e1; } .log-heading { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; } .log-heading h2 { margin: 0; font-size: 16px; } .log-output { height: min(56vh, 560px); overflow: auto; margin-top: 12px; border: 1px solid #9eafb8; background: #f8fbfa; padding: 10px; color: #34434a; font: 12px/1.5 Consolas, "Cascadia Mono", monospace; } .log-output:empty::before { content: "暂无日志"; color: #7b8b92; } .task-log-line { overflow-wrap: anywhere; } .task-log-time { color: #7b8b92; margin-right: 7px; } .task-log-line.error { color: #b42318; } .task-log-line.warning { color: #a15c00; } @media (max-width: 720px) { main { width: min(100% - 24px, 980px); padding-top: 26px; } header { align-items: start; flex-direction: column; } .detail-meta { grid-template-columns: 1fr; } .log-output { height: 48vh; } }
  </style>
</head>
<body>
  <main>
    <header><h1>任务详情</h1><a class="header-link" href="/">返回任务列表</a></header>
    <p id="notice" role="alert"></p>
    <section><div id="task-summary" aria-live="polite"></div><div class="log-heading"><h2>运行日志</h2></div><div id="task-log" class="log-output" role="log" aria-live="polite"></div></section>
  </main>
  <script>
    const taskID = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || ''); const summary = document.querySelector('#task-summary'); const logOutput = document.querySelector('#task-log'); const notice = document.querySelector('#notice'); const labels = { queued: '等待中', running: '下载中', paused: '已暂停', completed: '已完成', failed: '失败', cancelled: '已取消' }; const phaseLabels = { downloading: '下载分片', merging: '合并中' }; let logKeys = [];
    function escapeHTML(value) { const element = document.createElement('span'); element.textContent = value; return element.innerHTML; }
    function formatTime(seconds) { const total = Math.floor(seconds || 0); const hours = Math.floor(total / 3600); const minutes = Math.floor((total % 3600) / 60); const secs = total % 60; return `${hours ? `${hours}:` : ''}${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`; }
    function formatBytes(bytes) { if (!bytes) return '0 B'; const units = ['B', 'KB', 'MB', 'GB']; const index = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024))); return `${(bytes / (1024 ** index)).toFixed(index ? 1 : 0)} ${units[index]}`; }
    function formatProgress(item) { if (item.phase === 'downloading' && item.totalSegments) return `下载分片 ${item.completedSegments} / ${item.totalSegments} · ${formatBytes(item.downloadedBytes)}`; if (!item.progressSec) return item.phase ? phaseLabels[item.phase] : '等待进度'; return `${phaseLabels[item.phase] || '已处理'} ${formatTime(item.progressSec)}${item.durationSec ? ` / ${formatTime(item.durationSec)}` : ''}`; }
    function taskPercent(item) { if (item.phase === 'downloading' && item.totalSegments) return Math.min(100, Math.max(0, item.completedSegments / item.totalSegments * 100)); return item.durationSec ? Math.min(100, Math.max(0, item.progressSec / item.durationSec * 100)) : 0; }
    function logKey(entry) { return `${entry.at}|${entry.level}|${entry.message}`; }
    function appendLog(entry) { const line = document.createElement('div'); line.className = `task-log-line ${entry.level}`; const time = new Date(entry.at); line.innerHTML = `<span class="task-log-time">${Number.isNaN(time.getTime()) ? '--:--:--' : time.toLocaleTimeString('zh-CN', { hour12: false })}</span>${escapeHTML(entry.message)}`; logOutput.append(line); }
    function syncLogs(logs) { const next = (logs || []).map(logKey); const nearBottom = logOutput.scrollHeight - logOutput.clientHeight - logOutput.scrollTop < 24; const prefixMatches = logKeys.every((key, index) => next[index] === key); if (!prefixMatches) { logOutput.replaceChildren(); (logs || []).forEach(appendLog); } else { (logs || []).slice(logKeys.length).forEach(appendLog); } logKeys = next; if (nearBottom) logOutput.scrollTop = logOutput.scrollHeight; }
    function actions(item) { const pause = item.status === 'running' ? `<button data-action="pause" type="button">暂停</button>` : ''; const resume = item.status === 'paused' ? `<button data-action="resume" type="button">继续</button>` : ''; const cancel = ['queued', 'running', 'paused'].includes(item.status) ? `<button class="cancel" data-action="cancel" type="button">停止</button>` : ''; const upload = item.status === 'completed' && item.outputAvailable ? `<button data-action="telegram-upload" type="button">上传 TG</button>` : ''; const deleteOutput = item.outputAvailable ? `<button class="danger" data-action="delete-output" type="button">删除视频</button>` : ''; const deleteTask = ['completed', 'failed', 'cancelled'].includes(item.status) ? `<button class="danger" data-action="delete-task" type="button">删除任务</button>` : ''; return `${pause}${resume}${cancel}${upload}${deleteOutput}${deleteTask}`; }
    function render(item) { document.title = `${item.outputName} - 任务详情`; const download = item.outputAvailable ? ` · <a href="/api/tasks/${encodeURIComponent(item.id)}/download" download>获取文件</a>` : ''; const error = item.error ? `<div class="meta">${escapeHTML(item.error)}</div>` : ''; summary.innerHTML = `<div class="toolbar"><h2>${escapeHTML(item.outputName)}</h2><span class="badge ${item.status}">${labels[item.status] || item.status}</span></div><div class="summary"><div class="meta">${formatProgress(item)}${download}</div><div class="progress" aria-label="下载进度"><span style="width:${taskPercent(item)}%"></span></div>${error}<div class="detail-meta"><span>保存目录：${escapeHTML(item.outputDirectory)}</span><span>缓存目录：${escapeHTML(item.cacheDirectory || '未设置')}</span><span>分片并发：${item.workerCount}</span><span>缓存策略：${item.deleteCache ? '合并后删除' : '保留'}</span></div><div class="actions">${actions(item)}</div></div>`; syncLogs(item.logs); }
    async function request(path, options) { const response = await fetch(path, options); const body = await response.json(); if (!response.ok) throw new Error(body.error || '请求失败'); return body; }
    async function refresh() { try { render(await request(`/api/tasks/${encodeURIComponent(taskID)}`)); notice.textContent = ''; } catch (error) { notice.textContent = error.message; } }
    summary.addEventListener('click', async (event) => { const action = event.target.dataset.action; if (!action) return; if (action === 'delete-output' && !window.confirm('确定删除视频文件吗？任务记录和日志会保留。')) return; if (action === 'delete-task' && !window.confirm('确定删除该任务吗？视频文件、任务缓存、任务记录和日志都会删除。')) return; event.target.disabled = true; try { if (action === 'delete-output') await request(`/api/tasks/${encodeURIComponent(taskID)}/output`, { method: 'DELETE' }); else if (action === 'delete-task') { await request(`/api/tasks/${encodeURIComponent(taskID)}`, { method: 'DELETE' }); window.location.assign('/'); return; } else await request(`/api/tasks/${encodeURIComponent(taskID)}/${action}`, { method: 'POST' }); await refresh(); } catch (error) { notice.textContent = error.message; } finally { event.target.disabled = false; } });
    refresh(); setInterval(refresh, 1000);
  </script>
</body>
</html>
