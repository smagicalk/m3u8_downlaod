<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置 - M3U8 下载器</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; background: #f4f7f9; color: #16222a; } * { box-sizing: border-box; } body { margin: 0; min-width: 320px; } main { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 52px 0 72px; } header { display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid #cdd8dd; padding-bottom: 20px; } h1 { margin: 0; font-size: 28px; } h2 { margin: 0 0 12px; font-size: 16px; } section { margin-top: 30px; padding-top: 18px; border-top: 2px solid #16222a; } form { margin: 0; } .request-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; border-top: 1px solid #dbe3e7; padding-top: 18px; } .field { display: grid; gap: 6px; min-width: 0; } .field-wide { grid-column: 1 / -1; } .check-field { align-content: end; } label { color: #52636b; font-size: 13px; font-weight: 650; } input, select, button { min-height: 44px; border-radius: 6px; font: inherit; letter-spacing: 0; } input, select { width: 100%; border: 1px solid #9eafb8; background: #fff; padding: 0 12px; color: #16222a; outline: none; } input:focus, select:focus { border-color: #087f5b; box-shadow: 0 0 0 3px #bfe8da; } .check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: #34434a; font-size: 14px; } .check input { width: 16px; min-height: 16px; accent-color: #087f5b; } .directory-picker { display: flex; gap: 8px; min-width: 0; } .directory-picker input { min-width: 0; } .directory-select { flex: 0 0 44px; width: 44px; padding: 0; font-size: 18px; } button { border: 0; background: #087f5b; color: #fff; padding: 0 18px; cursor: pointer; font-weight: 650; } button:hover { background: #056b4c; } button:disabled { background: #9eafb8; cursor: not-allowed; } .secondary-button { background: transparent; border: 1px solid #9eafb8; color: #34434a; } .secondary-button:hover { background: #e5ecef; } .header-link { color: #056b4c; font-weight: 650; text-decoration: none; } .actions { display: flex; align-items: center; justify-content: end; flex-wrap: wrap; gap: 10px; margin-top: 14px; } #notice { min-height: 22px; margin: 18px 0 0; color: #b42318; font-size: 14px; } .telegram-state { color: #52636b; font-size: 13px; } @media (max-width: 720px) { main { width: min(100% - 24px, 980px); padding-top: 28px; } header { align-items: start; flex-direction: column; } .request-grid { grid-template-columns: 1fr; } .field-wide { grid-column: auto; } }
  </style>
</head>
<body>
  <main>
    <header><h1>设置</h1><a class="header-link" href="/">返回下载器</a></header>
    <p id="notice" role="alert"></p>
    <section aria-labelledby="download-settings-heading">
      <h2 id="download-settings-heading">下载默认值</h2>
      <form id="settings-form">
        <div class="request-grid">
          <div class="field"><label for="default-output-directory">默认保存目录</label><div class="directory-picker"><input id="default-output-directory" type="text"><button class="directory-select" type="button" data-directory-input="default-output-directory" aria-label="选择默认保存目录" title="选择默认保存目录">&#128193;</button></div></div>
          <div class="field"><label for="default-cache-directory">默认缓存目录</label><div class="directory-picker"><input id="default-cache-directory" type="text"><button class="directory-select" type="button" data-directory-input="default-cache-directory" aria-label="选择默认缓存目录" title="选择默认缓存目录">&#128193;</button></div></div>
          <div class="field check-field"><label>默认缓存处理</label><label class="check" for="default-delete-cache"><input id="default-delete-cache" type="checkbox"> 合并成功后删除缓存</label></div>
          <div class="field check-field"><label for="default-worker-count">默认分片并发数</label><select id="default-worker-count"><option value="1">1</option><option value="4">4</option><option value="8">8</option><option value="16">16</option></select></div>
          <div class="field"><label for="cache-retention-hours">停止/失败缓存保留（小时）</label><input id="cache-retention-hours" type="number" min="0" max="8760" value="168" placeholder="0 表示永久保留" required></div>
        </div>
        <div class="actions"><button id="save-settings" type="submit">保存默认设置</button></div>
      </form>
    </section>
    <section aria-labelledby="telegram-heading">
      <h2 id="telegram-heading">Telegram Bot</h2>
      <form id="telegram-form">
        <div class="request-grid">
          <div class="field"><label for="telegram-api-base-url">本地 Bot API Server 地址</label><input id="telegram-api-base-url" type="url" value="http://127.0.0.1:8081" required></div>
          <div class="field"><label for="telegram-token">Bot Token</label><input id="telegram-token" type="password" autocomplete="off" placeholder="已绑定时留空以保留原 Token"></div>
          <div class="field field-wide"><label for="telegram-chat-ids">目标 Chat ID</label><input id="telegram-chat-ids" type="text" placeholder="多个 ID 用英文逗号分隔，例如 123456,-1001234567890" required></div>
          <div class="field check-field"><label>上传策略</label><label class="check" for="telegram-auto-upload"><input id="telegram-auto-upload" type="checkbox"> 下载完成后自动上传</label></div>
          <div class="field"><label for="telegram-split-size">切分大小（MB）</label><input id="telegram-split-size" type="number" min="1" max="2000" value="1900" required></div>
        </div>
        <div class="actions"><span id="telegram-state" class="telegram-state"></span><button id="unbind-telegram" class="secondary-button" type="button">解除绑定</button><button id="test-telegram" class="secondary-button" type="button">测试连接</button><button id="save-telegram" type="submit">保存 Bot 绑定</button></div>
      </form>
    </section>
  </main>
  <script>
    const settingsForm = document.querySelector('#settings-form'); const telegramForm = document.querySelector('#telegram-form'); const notice = document.querySelector('#notice'); const outputDirectory = document.querySelector('#default-output-directory'); const cacheDirectory = document.querySelector('#default-cache-directory'); const deleteCache = document.querySelector('#default-delete-cache'); const workerCount = document.querySelector('#default-worker-count'); const cacheRetentionHours = document.querySelector('#cache-retention-hours'); const saveSettings = document.querySelector('#save-settings'); const apiBaseURL = document.querySelector('#telegram-api-base-url'); const botToken = document.querySelector('#telegram-token'); const chatIDs = document.querySelector('#telegram-chat-ids'); const autoUpload = document.querySelector('#telegram-auto-upload'); const splitSize = document.querySelector('#telegram-split-size'); const telegramState = document.querySelector('#telegram-state'); const saveTelegram = document.querySelector('#save-telegram'); const testTelegram = document.querySelector('#test-telegram'); const unbindTelegram = document.querySelector('#unbind-telegram');
    async function request(path, options) { const response = await fetch(path, options); const body = await response.json(); if (!response.ok) throw new Error(body.error || '请求失败'); return body; }
    async function load() { try { const [defaults, telegram] = await Promise.all([request('/api/settings/defaults'), request('/api/telegram/config')]); outputDirectory.value = defaults.outputDirectory; cacheDirectory.value = defaults.cacheDirectory; deleteCache.checked = defaults.deleteCache; workerCount.value = String(defaults.workerCount); cacheRetentionHours.value = String(defaults.cacheRetentionHours); apiBaseURL.value = telegram.apiBaseUrl; chatIDs.value = telegram.chatIds; autoUpload.checked = telegram.autoUpload; splitSize.value = String(telegram.splitSizeMb); botToken.placeholder = telegram.botTokenConfigured ? '已绑定，留空以保留原 Token' : '请输入 Bot Token'; telegramState.textContent = telegram.connected ? '已绑定，正在监听 Bot 指令' : '尚未完成绑定'; } catch (error) { notice.textContent = error.message; } }
    async function chooseDirectory(input, button) { button.disabled = true; notice.textContent = ''; try { const result = await request('/api/directories/select', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ initialDirectory: input.value }) }); if (result.path) input.value = result.path; } catch (error) { notice.textContent = error.message; } finally { button.disabled = false; } }
    document.addEventListener('click', (event) => { const button = event.target.closest('[data-directory-input]'); if (!button) return; const input = document.querySelector(`#${button.dataset.directoryInput}`); if (input) chooseDirectory(input, button); });
    settingsForm.addEventListener('submit', async (event) => { event.preventDefault(); notice.textContent = ''; saveSettings.disabled = true; try { await request('/api/settings/defaults', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ outputDirectory: outputDirectory.value, cacheDirectory: cacheDirectory.value, deleteCache: deleteCache.checked, workerCount: Number(workerCount.value), cacheRetentionHours: Number(cacheRetentionHours.value) }) }); notice.textContent = '默认设置已保存'; } catch (error) { notice.textContent = error.message; } finally { saveSettings.disabled = false; } });
    telegramForm.addEventListener('submit', async (event) => { event.preventDefault(); notice.textContent = ''; saveTelegram.disabled = true; try { const telegram = await request('/api/telegram/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ apiBaseUrl: apiBaseURL.value, botToken: botToken.value, chatIds: chatIDs.value, autoUpload: autoUpload.checked, splitSizeMb: Number(splitSize.value) }) }); botToken.value = ''; botToken.placeholder = telegram.botTokenConfigured ? '已绑定，留空以保留原 Token' : '请输入 Bot Token'; telegramState.textContent = telegram.connected ? '已绑定，正在监听 Bot 指令' : '尚未完成绑定'; notice.textContent = 'Telegram Bot 设置已保存'; } catch (error) { notice.textContent = error.message; } finally { saveTelegram.disabled = false; } });
    testTelegram.addEventListener('click', async () => { notice.textContent = ''; testTelegram.disabled = true; try { await request('/api/telegram/test', { method: 'POST' }); telegramState.textContent = 'Bot API Server 连接正常'; } catch (error) { notice.textContent = error.message; } finally { testTelegram.disabled = false; } });
    unbindTelegram.addEventListener('click', async () => { notice.textContent = ''; unbindTelegram.disabled = true; try { const telegram = await request('/api/telegram/config', { method: 'DELETE' }); botToken.value = ''; chatIDs.value = ''; autoUpload.checked = false; telegramState.textContent = telegram.connected ? '已绑定，正在监听 Bot 指令' : '已解除绑定'; } catch (error) { notice.textContent = error.message; } finally { unbindTelegram.disabled = false; } });
    load();
  </script>
</body>
</html>
