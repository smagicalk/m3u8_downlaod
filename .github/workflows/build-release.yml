name: 构建多系统发布包

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 源码分支或 tag，只需填写一个
        required: true
        default: dev
        type: string

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-latest
            runner: ubuntu-latest
          - target: debian-13
            runner: ubuntu-latest
          - target: alpine-latest
            runner: ubuntu-latest
          - target: windows-latest
            runner: windows-latest
    steps:
      - name: 检出指定源码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: 构建 Linux 包
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p dist
          binary="m3u8-downloader-${TARGET}-amd64"
          go build -trimpath -ldflags '-s -w' -o "dist/${binary}" .
          tar -C dist -czf "dist/${binary}.tar.gz" "$binary"
          rm "dist/${binary}"

      - name: 构建 Windows 包
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $binary = 'm3u8-downloader-windows-latest-amd64.exe'
          go build -trimpath -ldflags '-s -w' -o "dist/$binary" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "dist/$binary" -DestinationPath "dist/$binary.zip" -Force
          Remove-Item -LiteralPath "dist/$binary"

      - name: 上传系统产物
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: 汇总产物并按需发布
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出指定源码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: 下载全部系统产物
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: 识别源码类型并生成校验文件
        id: release
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/${SOURCE_REF}^{commit}" >/dev/null; then
            is_tag='true'
            release_tag="$SOURCE_REF"
            artifact_label="$SOURCE_REF"
          else
            is_tag='false'
            release_tag=''
            safe_ref="$(printf '%s' "$SOURCE_REF" | sed 's/[^A-Za-z0-9._-]/-/g')"
            artifact_label="$safe_ref"
          fi
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS.txt)
          echo "is_tag=$is_tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "artifact_label=$artifact_label" >> "$GITHUB_OUTPUT"

      - name: 上传汇总产物
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-downloader-${{ steps.release.outputs.artifact_label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: 创建或更新 GitHub Release
        if: steps.release.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          assets=(dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --target "$commit" --title "$RELEASE_TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
